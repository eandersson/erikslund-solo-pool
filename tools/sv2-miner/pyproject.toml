[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erikslund-sv2-miner"
version = "0.1.0"
description = "Plaintext Stratum V2 protocol test client for erikslund-pool"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
erikslund-sv2-miner = "sv2_miner:main"

[tool.setuptools]
py-modules = ["sv2_miner"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
