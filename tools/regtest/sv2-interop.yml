# yaml-language-server: $schema=../../conf/pool.schema.json
# Authenticated endpoint for SRI interoperability tests.
bitcoin_nodes:
  - address: bitcoind:18443
    username: erikslund
    password: erikslundpass
stratum_listen:
  - 0.0.0.0:3333
sv2_listen:
  - 0.0.0.0:4333
sv2_static_secret_key_file: /sv2/server.secret
sv2_authority_public_key_file: /sv2/runtime-authority.public
sv2_certificate_file: /sv2/server.cert
api_listen:
  - 0.0.0.0:7777
initial_difficulty: 0.0001
minimum_difficulty: 0.0001
variable_difficulty: true
vardiff_target_shares_per_minute: 12
vardiff_retarget_seconds: 10
extranonce2_size: 8
coinbase_signature: /sv2 interop/
block_poll_milliseconds: 1000
work_rebroadcast_seconds: 30
stats_directory: /stats
status_interval_seconds: 5
zmq_block_endpoint: tcp://bitcoind:28332
