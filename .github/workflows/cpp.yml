# Regtest runs separately in e2e.yml.
name: C++

on:
  push:
    paths:
      - 'cpp/**'
      - 'conf/pool.schema.json'
      - '.github/workflows/cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'conf/pool.schema.json'
      - '.github/workflows/cpp.yml'

concurrency:
  group: cpp-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate production Dockerfile
        run: docker build --check -f cpp/Dockerfile .
      - name: Build + unit tests (doctest + native Noise suite, in the toolchain image)
        run: |
          docker build -t erikslund-pool-cpp cpp/docker
          docker run --rm -v "$PWD/cpp:/src:ro" \
            -v cpp-build:/build erikslund-pool-cpp

  # The C core's own tests also run inside build-test / sanitizers / thread-sanitizer, because
  # cpp/CMakeLists.txt builds cpp/src/sv2_noise with SV2_NOISE_BUILD_TESTS=ON. What only this job
  # covers is the subproject configuring standalone as a top-level CMake project -- where the
  # credential tool and the tests default ON and nothing from the pool's CMakeLists.txt applies.
  noise-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Standalone Noise build and sanitizers
        run: |
          docker build -t erikslund-pool-cpp cpp/docker
          docker run --rm -v "$PWD/cpp:/src:ro" \
            -v cpp-noise-build:/build \
            --entrypoint /bin/bash erikslund-pool-cpp -lc '
              set -euo pipefail
              sanitizer_flags="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
              cmake -S /src/src/sv2_noise -B /build/noise \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="$sanitizer_flags" \
                -DCMAKE_CXX_FLAGS="$sanitizer_flags" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
              cmake --build /build/noise --parallel "$(nproc)"
              ASAN_OPTIONS=halt_on_error=1:abort_on_error=1:detect_leaks=1 \
                UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                ctest --test-dir /build/noise --output-on-failure
            '

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: clang-tidy (static-analysis gate)
        run: |
          docker build -t erikslund-pool-cpp cpp/docker
          docker run --rm -v "$PWD/cpp:/src:ro" \
            -v cpp-tidy-build:/build \
            --entrypoint /usr/local/bin/clang-tidy.sh erikslund-pool-cpp

  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: cppcheck (static-analysis gate)
        run: |
          docker build -t erikslund-pool-cpp cpp/docker
          docker run --rm -v "$PWD/cpp:/src:ro" \
            --entrypoint /usr/local/bin/cppcheck.sh erikslund-pool-cpp

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: ASan + UBSan (runtime gate over the adversarial corpus + the Noise core)
        run: |
          docker build -t erikslund-pool-cpp cpp/docker
          docker run --rm -v "$PWD/cpp:/src:ro" \
            -v cpp-asan-build:/build \
            --entrypoint /usr/local/bin/sanitize.sh erikslund-pool-cpp

  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: TSan (runtime gate over concurrent tests)
        run: |
          docker build -t erikslund-pool-cpp cpp/docker
          docker run --rm -v "$PWD/cpp:/src:ro" \
            -v cpp-tsan-build:/build \
            --entrypoint /usr/local/bin/tsan.sh erikslund-pool-cpp
