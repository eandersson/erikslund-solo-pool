name: E2E (regtest)

on:
  push:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Mine a regtest block through the pool
        run: KEEP=0 bash ./docker/smoketest.sh

  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Fail over to a backup Bitcoin Core node
        run: bash ./tools/regtest/failover-test.sh
