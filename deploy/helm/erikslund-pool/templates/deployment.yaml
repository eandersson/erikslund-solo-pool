{{- include "erikslund-pool.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erikslund-pool.fullname" . }}
  labels: {{- include "erikslund-pool.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "erikslund-pool.selectorLabels" . | nindent 6 }}
  strategy:
    # Do not overlap old and new pods that share one work domain.
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.sv2.enabled }}
        checksum/sv2-credentials: {{ .Values.sv2.credentialsVersion | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- include "erikslund-pool.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "erikslund-pool.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pool
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{- toYaml .Values.args | nindent 12 }}
          ports:
            - name: stratum
              containerPort: 3333
              protocol: TCP
            {{- if .Values.sv2.enabled }}
            - name: sv2
              containerPort: {{ .Values.sv2.port }}
              protocol: TCP
            {{- end }}
            - name: api
              containerPort: 7777
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: api
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            # A bitcoind outage should fail readiness without restarting the pool.
            tcpSocket:
              port: stratum
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- with .Values.lifecycle }}
          lifecycle: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/erikslund-pool
              readOnly: true
            {{- if .Values.sv2.enabled }}
            - name: sv2-credentials
              mountPath: /etc/erikslund-pool/sv2
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /var/lib/erikslund-pool
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ include "erikslund-pool.secretName" . }}
        {{- if .Values.sv2.enabled }}
        - name: sv2-credentials
          secret:
            secretName: {{ .Values.sv2.existingSecret }}
            defaultMode: 0440
        {{- end }}
        # The spool is only a crash safety net.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
