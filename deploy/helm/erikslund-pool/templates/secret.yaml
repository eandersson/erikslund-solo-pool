{{- if not .Values.config.existingSecret }}
{{- $settings := deepCopy .Values.config.settings }}
{{- if .Values.sv2.enabled }}
{{- $settings = set $settings "sv2_listen" (list (printf "0.0.0.0:%d" (int .Values.sv2.port))) }}
{{- $settings = set $settings "sv2_static_secret_key_file" "/etc/erikslund-pool/sv2/server-static.secret" }}
{{- $settings = set $settings "sv2_authority_public_key_file" "/etc/erikslund-pool/sv2/server-authority.public" }}
{{- $settings = set $settings "sv2_certificate_file" "/etc/erikslund-pool/sv2/server.cert" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "erikslund-pool.secretName" . }}
  labels: {{- include "erikslund-pool.labels" . | nindent 4 }}
type: Opaque
stringData:
  # pool.yml contains the bitcoind RPC password.
  pool.yml: |
    {{- toYaml $settings | nindent 4 }}
{{- end }}
