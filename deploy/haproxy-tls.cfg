global
    log stdout format raw local0
    maxconn 1024
    nbthread 2

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend sv1_tls
    bind 0.0.0.0:3334 ssl crt /etc/haproxy/tls/server.pem ssl-min-ver TLSv1.2
    default_backend sv1_pool

backend sv1_pool
    server pool 127.0.0.1:3333 send-proxy-v2
